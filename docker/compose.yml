services:
  starcomms-shard:
    build: .
    image: starcomms-shard:local
    container_name: starcomms-shard
    restart: unless-stopped
    env_file: .env
    ports:
      - "${STARCOMMS_SHARD_PORT:-8787}:${STARCOMMS_SHARD_PORT:-8787}/tcp"
      - "${STARCOMMS_SHARD_PORT:-8787}:${STARCOMMS_SHARD_PORT:-8787}/udp"
    volumes:
      - shard-data:/data

volumes:
  shard-data:
